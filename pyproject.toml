[project]
name = "predictor-sismos-panama"
version = "0.1.0"
description = "PoC probabilistic earthquake forecasting for Panama (M4+ 7-day, 5 zones)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.26",
  "pyarrow>=14",
  "duckdb>=0.10",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "mlflow>=2.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.33",
  "folium>=0.16",
  "dramatiq>=2.2.1",
  "redis>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.ruff]
line-length = 100
